[project]
name = "financial-risk-agent-eval-tools"
version = "0.1.0"
description = "Financial risk LangGraph agent with Redis caching and GenAI evaluation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
